# Managed by Deployer. Review and merge this PR to enable deployments.
name: Deployer
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deployer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          pnpm i
      - name: Build static app
        run: |
          pnpm run build
      - name: Upload static app
        uses: actions/upload-artifact@v7
        with:
          name: deployer-app
          path: dist/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 3
