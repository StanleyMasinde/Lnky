<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#272522" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />

    <!-- iOS PWA options-->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lnky" />

    <!-- Primary Meta Tags -->
    <title>Lnky - Remove trackers from links</title>
    <meta name="title" content="Lnky - Remove trackers from links" />
    <meta
      name="description"
      content="With Lnky, you can enhance your online privacy by removing common tracking ids from your links. You can also save your links for later"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lnky - Remove trackers from links" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="Lnky - Remove trackers from links" />
    <meta
      property="og:description"
      content="With Lnky, you can enhance your online privacy by removing common tracking ids from your links. You can also save your links for later"
    />
    <meta property="og:image" content="/icons/icon-512-maskable.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="/" />
    <meta property="twitter:title" content="Lnky - Remove trackers from links" />
    <meta
      property="twitter:description"
      content="With Lnky, you can enhance your online privacy by removing common tracking ids from your links. You can also save your links for later"
    />
    <meta property="twitter:image" content="/icons/icon-512-maskable.png" />

    <meta name="author" content="Stanley Masinde" />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Hallmark · design-system: design.md — Space Grotesk (display) + IBM Plex Sans (body) + JetBrains Mono (URLs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <div>
      <div hidden role="alert" class="global-error" id="universalErr"></div>
    </div>
  </body>
</html>
